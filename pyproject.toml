[project]
name = "toronto-data-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Toronto open data warehouse"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "sqlglot==30.21.0", "psycopg[binary]==3.3.6"]

[project.scripts]
toronto-mcp = "toronto_mcp.server:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["toronto_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
